name: Frontend (prod) deploy
on:
  push:
    branches: [ "main" ]
    paths: [ "viz/**", ".github/workflows/deploy-frontend-prod.yml" ]
permissions: { id-token: write, contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build SPA
        working-directory: viz
        env:
          VITE_API_BASE: "https://api.civicmapper.org"         # or "https://www.civicmapper.org/api" if using FD path
          VITE_TILE_API_URL: "https://tiles.civicmapper.org"
          VITE_ENV_LABEL: "Prod"
          VITE_DEPLOY_ENV: "prod"
        run: |
          npm ci
          npm run build
      - name: Upload to Storage Static Website
        run: |
          az storage blob upload-batch --account-name stcivicmapperprod \
            --auth-mode login \
            -d '$web' -s viz/dist --overwrite
      - name: Purge Front Door cache
        continue-on-error: true
        run: |
          az afd endpoint purge -g rg-civicmapper-prod --profile-name afd-civicmapper-prod \
            --endpoint-name ep-civicmapper-prod \
            --content-paths "/*"
