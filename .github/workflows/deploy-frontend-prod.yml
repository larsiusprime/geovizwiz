name: Deploy Frontend (prod)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viz/package-lock.json

      - name: Install deps
        working-directory: viz
        run: npm ci

      - name: Build (Vite)
        working-directory: viz
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE_PROD || 'http://localhost:8080' }}
          VITE_TILE_API_URL: ${{ secrets.VITE_TILE_API_URL_PROD || 'http://localhost:8000/tiles/{z}/{x}/{y}.pbf' }}
          VITE_DEFAULT_DATASET_URL: ${{ secrets.VITE_DEFAULT_DATASET_URL_PROD || '' }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-prod-dist
          path: viz/dist

