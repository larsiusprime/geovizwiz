<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPKG Metadata Reader</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>GPKG Metadata Reader</h1>
            <p>Drag and drop a .GPKG file to view its field metadata</p>
        </header>

        <main>
            <div class="drop-zone" id="dropZone">
                <div class="drop-zone-content">
                    <div class="upload-icon">📁</div>
                    <h3>Drop your .GPKG file here</h3>
                    <p>or click to browse</p>
                    <input type="file" id="fileInput" accept=".gpkg" style="display: none;">
                </div>
            </div>

            <div class="results" id="results" style="display: none;">
                <h2>File Metadata</h2>
                <div class="file-info" id="fileInfo"></div>
                <div class="fields-container">
                    <h3>Fields</h3>
                    <div class="fields-list" id="fieldsList"></div>
                </div>
            </div>

            <div class="error" id="error" style="display: none;">
                <h3>Error</h3>
                <p id="errorMessage"></p>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/sql-wasm.js"></script>
    <script src="script.js"></script>
</body>
</html>
