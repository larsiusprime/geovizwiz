<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoConverter - GPKG & Shapefile to GeoParquet</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>GeoConverter</h1>
            <p>Convert GPKG files or zipped Shapefiles to GeoParquet format</p>
        </header>

        <main>
            <div class="drop-zone" id="dropZone">
                <div class="drop-zone-content">
                    <div class="upload-icon">📁</div>
                    <h3>Drop your .GPKG or .ZIP shapefile here</h3>
                    <p>or click to browse</p>
                    <input type="file" id="fileInput" accept=".gpkg,.zip" style="display: none;">
                </div>
            </div>

            <div id="error" class="error" style="display: none;">
                <div class="error-content">
                    <span class="error-icon">❌</span>
                    <span id="errorMessage"></span>
                </div>
            </div>

            <div id="results" class="results" style="display: none;">
                <div id="fileSummary" class="file-summary"></div>
                
                <div class="selection-controls">
                    <button id="selectAllBtn" class="btn btn-secondary">Select All</button>
                    <button id="selectNoneBtn" class="btn btn-secondary">Select None</button>
                </div>
                
                <div id="fieldsGrid" class="fields-grid"></div>
                
                <div class="convert-section">
                    <button id="convertBtn" class="btn btn-primary" disabled>
                        Convert Selected Fields to GeoParquet
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="sql-wasm.js"></script>
    <script src="arrow.js"></script>
    <script src="script.js"></script>
</body>
</html>
