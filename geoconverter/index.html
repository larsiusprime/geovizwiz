<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPKG to GeoParquet Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>GPKG to GeoParquet Converter</h1>
            <p>Select the fields you want to convert from your GPKG file</p>
        </header>

        <main>
            <div class="drop-zone" id="dropZone">
                <div class="drop-zone-content">
                    <div class="upload-icon">📁</div>
                    <h3>Drop your .GPKG file here</h3>
                    <p>or click to browse</p>
                    <input type="file" id="fileInput" accept=".gpkg" style="display: none;">
                </div>
            </div>

            <div class="results" id="results" style="display: none;">
                <div class="file-summary" id="fileSummary"></div>
                
                <div class="field-selection-container">
                    <div class="selection-header">
                        <h3>Select Fields to Convert</h3>
                        <div class="selection-controls">
                            <button class="btn-secondary" id="selectAllBtn">Select All</button>
                            <button class="btn-secondary" id="selectNoneBtn">Select None</button>
                        </div>
                    </div>
                    
                    <div class="fields-grid" id="fieldsGrid"></div>
                    
                    <div class="action-buttons">
                        <button class="btn-primary" id="convertBtn" disabled>
                            Convert Selected Fields to GeoParquet
                        </button>
                    </div>
                </div>
            </div>

            <div class="error" id="error" style="display: none;">
                <h3>Error</h3>
                <p id="errorMessage"></p>
            </div>
        </main>
    </div>

    <script src="sql-wasm.js"></script>
    <script src="script.js"></script>
</body>
</html>
