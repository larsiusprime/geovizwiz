<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Info - Civic Mapper</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/src/design-system.css">
    <link rel="stylesheet" href="/src/components.css">
    <script
        async
        src="https://widgets.givebutter.com/latest.umd.cjs?acct=v4mTQ1h5BqmD4ofT&p=other"
    ></script>
    <style>
        body {
            padding: var(--space-8) var(--space-4);
        }
        .debug-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .debug-header {
            text-align: center;
            margin-bottom: var(--space-8);
        }
        .debug-header h1 {
            margin: 0 0 var(--space-2);
            font-size: var(--text-4xl);
            font-weight: var(--font-bold);
        }
        .debug-header p {
            margin: 0;
            color: var(--text-secondary);
        }
        .debug-section {
            margin-bottom: var(--space-6);
        }
        .debug-section h3 {
            margin: 0 0 var(--space-4);
            font-size: var(--text-xl);
            font-weight: var(--font-semibold);
            color: var(--text-primary);
        }
        .debug-content {
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-xl);
            padding: var(--space-4);
        }
        pre {
            background: var(--color-gray-100);
            padding: var(--space-3);
            border-radius: var(--radius-md);
            overflow-x: auto;
            white-space: pre-wrap;
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            margin: var(--space-3) 0;
        }
        .status {
            padding: var(--space-3);
            border-radius: var(--radius-lg);
            margin: var(--space-2) 0;
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: var(--text-sm);
        }
        .status-success {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .status-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .status-warning {
            background-color: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
        }
        .actions {
            display: flex;
            gap: var(--space-3);
            flex-wrap: wrap;
            padding: var(--space-4);
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-xl);
        }
    </style>
</head>
<body>
    <div class="debug-container">
        <div class="debug-header">
            <h1>🔍 Debug Information</h1>
            <p>Development and testing tools for Civic Mapper</p>
        </div>
        
        <div class="debug-section">
            <h3>Environment Variables</h3>
            <div class="debug-content" id="envDebug">
                <div class="status status-warning">Loading...</div>
            </div>
        </div>
        
        <div class="debug-section">
            <h3>Sign-in Debug</h3>
            <div class="debug-content" id="signinDebug">
                <div class="status status-warning">Loading...</div>
            </div>
        </div>
        
        <div class="debug-section">
            <h3>Sign-ins History</h3>
            <div class="debug-content" id="signinsHistory">
                <div class="status status-warning">Loading...</div>
            </div>
        </div>
        
        <div class="debug-section">
            <h3>Actions</h3>
            <div class="actions">
                <button class="btn btn-primary" onclick="refreshDebug()">
                    🔄 Refresh Debug Info
                </button>
                <button class="btn btn-ghost" onclick="clearDebug()">
                    🗑️ Clear Debug Info
                </button>
                <button class="btn btn-secondary" onclick="testSlackWebhook()">
                    📤 Test Slack Webhook
                </button>
            </div>
        </div>
    </div>

    <script>
        function refreshDebug() {
            loadDebugInfo();
        }
        
        function clearDebug() {
            localStorage.removeItem('gvw_debug');
            localStorage.removeItem('gvw_signin_debug');
            localStorage.removeItem('gvw_signins');
            loadDebugInfo();
        }
        
        async function testSlackWebhook() {
            const proxyUrl = "http://localhost:3001/api/slack";
            
            console.log('Testing proxy URL:', proxyUrl);
            
            try {
                const response = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: 'Debug test message from debug page via proxy' })
                });
                
                if (response.ok) {
                    alert('✅ Slack test message sent successfully!');
                } else {
                    alert(`❌ Slack test failed: ${response.status}`);
                }
            } catch (error) {
                alert(`❌ Slack test error: ${error.message}`);
            }
        }
        
        function loadDebugInfo() {
            // Environment debug
            const envDebug = localStorage.getItem('gvw_debug');
            const envDebugDiv = document.getElementById('envDebug');
            if (envDebug) {
                const parsed = JSON.parse(envDebug);
                envDebugDiv.innerHTML = `
                    <div class="status ${parsed.hasSlackWebhook ? 'status-success' : 'status-error'}">
                        <span>Slack Webhook: ${parsed.hasSlackWebhook ? '✅ Found' : '❌ Missing'}</span>
                    </div>
                    <div class="status ${parsed.enableGoogleAuth ? 'status-success' : 'status-warning'}">
                        <span>Google Auth: ${parsed.enableGoogleAuth ? '✅ Enabled' : '⚠️ Disabled'}</span>
                    </div>
                    <div class="status ${parsed.hasClientId ? 'status-success' : 'status-error'}">
                        <span>Google Client ID: ${parsed.hasClientId ? '✅ Found' : '❌ Missing'}</span>
                    </div>
                    <pre>${JSON.stringify(parsed, null, 2)}</pre>
                `;
            } else {
                envDebugDiv.innerHTML = '<div class="status status-error">No environment debug info found</div>';
            }
            
            // Sign-in debug
            const signinDebug = localStorage.getItem('gvw_signin_debug');
            const signinDebugDiv = document.getElementById('signinDebug');
            if (signinDebug) {
                const parsed = JSON.parse(signinDebug);
                signinDebugDiv.innerHTML = `
                    <div class="status ${parsed.slackWebhookExists ? 'status-success' : 'status-error'}">
                        <span>Slack Webhook Available: ${parsed.slackWebhookExists ? '✅ Yes' : '❌ No'}</span>
                    </div>
                    <div class="status ${parsed.emailFound ? 'status-success' : 'status-error'}">
                        <span>Email Found: ${parsed.emailFound ? '✅ Yes' : '❌ No'}</span>
                    </div>
                    <pre>${JSON.stringify(parsed, null, 2)}</pre>
                `;
            } else {
                signinDebugDiv.innerHTML = '<div class="status status-warning">No sign-in debug info found (try signing in first)</div>';
            }
            
            // Sign-ins history
            const signinsHistory = localStorage.getItem('gvw_signins');
            const signinsHistoryDiv = document.getElementById('signinsHistory');
            if (signinsHistory) {
                const parsed = JSON.parse(signinsHistory);
                signinsHistoryDiv.innerHTML = `
                    <div class="status status-success">Found ${parsed.length} sign-in(s)</div>
                    <pre>${JSON.stringify(parsed, null, 2)}</pre>
                `;
            } else {
                signinsHistoryDiv.innerHTML = '<div class="status status-warning">No sign-ins history found</div>';
            }
        }
        
        // Load debug info on page load
        loadDebugInfo();
    </script>
</body>
</html>
