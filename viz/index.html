<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Civic Mapper</title>
  <script>
    try {
      const authed = !!sessionStorage.getItem('gvw_session_authed');
      if (!authed) window.location.href = 'login.html';
    } catch {
      // If storage unavailable, let page load.
    }
  </script>
  <script>
    // Fire a Slack notify from the city picker as a backup path.
    (function ensureSlackFromIndex(){
      try {
        const authed = sessionStorage.getItem('gvw_session_authed') === '1';
        const email = sessionStorage.getItem('gvw_session_email');
        const sent = sessionStorage.getItem('gvw_session_slack_sent') === '1';
        if (!authed || !email || sent) return;
        let attempt = 0; const maxAttempts = 4;
        const text = `Google sign-in: ${email} (index)`;
        const trySend = () => {
          if (attempt >= maxAttempts) return;
          attempt++;
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 6000);
          fetch('/api/slack', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }), signal: ctrl.signal })
            .then(r => {
              clearTimeout(t);
              if (r.ok) sessionStorage.setItem('gvw_session_slack_sent', '1');
              else setTimeout(trySend, Math.min(10000, 400 * Math.pow(2, attempt-1)));
            })
            .catch(() => {
              clearTimeout(t);
              setTimeout(trySend, Math.min(10000, 400 * Math.pow(2, attempt-1)));
            });
        };
        window.addEventListener('online', () => { if (attempt>0 && attempt<maxAttempts && sessionStorage.getItem('gvw_session_slack_sent')!=='1') trySend(); }, { passive:true });
        document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible' && attempt>0 && attempt<maxAttempts && sessionStorage.getItem('gvw_session_slack_sent')!=='1') trySend(); }, { passive:true });
        window.addEventListener('pagehide', () => {
          if (sessionStorage.getItem('gvw_session_slack_sent')==='1') return;
          if (typeof navigator.sendBeacon === 'function') {
            const blob = new Blob([JSON.stringify({ text })], { type: 'application/json' });
            navigator.sendBeacon('/api/slack', blob);
          }
        }, { once:true });
        trySend();
      } catch {}
    })();
  </script>
  <link rel="icon" href="data:,">
  <style>
    :root { --panel:#fff; --shadow:0 6px 24px rgba(0,0,0,.12); --gap:12px; }
    *, *::before, *::after { box-sizing:border-box; }
    html, body { margin:0; font-family:system-ui,sans-serif; background:#f6f7f9; }
    #title { position:sticky; top:0; z-index:10; padding:12px; background:#fff; box-shadow:var(--shadow); font-weight:600; text-align:center; }
    #title .tip { font-weight:400; font-size:12.5px; color:#555; margin-top:2px; }
    #app { max-width:980px; margin:0 auto; padding:20px 14px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:var(--gap); }
    .card { background:#fff; border-radius:12px; box-shadow:var(--shadow); padding:14px; display:grid; gap:8px; text-decoration:none; color:inherit; }
    .card:hover { box-shadow:0 8px 28px rgba(0,0,0,.16); }
    .card h3 { margin:0; font-size:16px; }
    .card p { margin:0; color:#555; font-size:13px; }
  </style>
</head>
<body>
  <div id="title">Civic Mapper
    <div class="tip">Choose a city to explore</div>
  </div>
  <div id="app">
    <div class="grid" id="cityGrid">
      <a class="card" href="app.html?city=southbend">
        <h3>South Bend, IN</h3>
      </a>
      <a class="card" href="app.html?city=syracuse">
        <h3>Syracuse, NY</h3>
      </a>
    </div>
  </div>
</body>
</html>
