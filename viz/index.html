<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>South Bend Civil Map</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --panel:#fff; --shadow:0 6px 24px rgba(0,0,0,.12); --gap:10px; --tabH:48px; }
    *, *::before, *::after { box-sizing: border-box; }

    html, body, #app { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    #tabs { position:absolute; top:0; left:0; right:0; height:var(--tabH); display:flex; gap:6px; align-items:center; padding:6px 10px; background:var(--panel); box-shadow:var(--shadow); z-index:30; }
    #tabs button { border:1px solid #ddd; background:#f8f8f8; padding:6px 8px; border-radius:8px; cursor:pointer; }
    #tabs button.active { background:#e0e0e0; }
    #map { position:absolute; top:var(--tabH); bottom:0; left:0; right:0; }

    #title {
      position: absolute; top: calc(var(--tabH) + 10px); left: 50%;
      transform: translateX(-50%);
      background: var(--panel); padding: 6px 12px; border-radius: 8px;
      box-shadow: var(--shadow); font-weight: 600; z-index: 20;
    }

    #controls {
      position: absolute; top: calc(var(--tabH) + 10px); left: 10px;
      width: min(92vw, 420px);
      background: var(--panel); padding: 12px; border-radius: 12px; box-shadow: var(--shadow);
      display: grid; gap: var(--gap); z-index: 10;
    }

    #controls fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; }
    #controls label { display:block; font-size: 12px; color: #333; }
    #controls select, #controls input[type="number"], #controls input[type="text"] {
      width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px;
    }

    #controls .row {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: var(--gap);
      align-items: end;
    }
    #controls .row > * { min-width: 0; }

    #controls .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
    #controls button {
      border: 1px solid #ddd; background: #f8f8f8; padding: 6px 8px; border-radius: 8px; cursor: pointer;
    }
    #controls button:hover { background: #f0f0f0; }

    #legend { display: none; align-items: center; gap: 6px; }
    #legend .swatch { width: 18px; height: 12px; border-radius: 2px; border: 1px solid #00000022; }
    .muted { color:#666; font-size:12px; }

    .inline { display:grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    input[type="range"] { width: 100%; margin: 0; }
    output { font-size: 12px; color:#333; min-width: 2.8ch; text-align: right; }

    #statusFieldset { display:none; }

    /* overlays */
    .overlay {
      position: absolute; inset: 0; display: none; place-items: center;
      background: rgba(0,0,0,.35); z-index: 30;
    }
    .overlay.show { display: grid; }
    .modal {
      width: min(96vw, 680px); max-height: 88vh; overflow: hidden;
      background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 10px;
    }
    .modal h3 { margin: 0 0 4px; font-size: 16px; }
    .modal .footer { display: flex; gap: 8px; justify-content: flex-end; }

    .section-title { font-weight: 600; margin-top: 4px; }
    .divider { height: 1px; background: #e6e6e6; margin: 6px 0; }

    /* field lists */
    .fieldlist { display: grid; grid-template-columns: 1fr; gap: 8px; }
    #fieldList { max-height: 60vh; overflow: auto; padding-right: 4px; }

    .progress { height: 8px; background: #eee; border-radius: 999px; overflow: hidden; }
    .progress .bar { height: 100%; width: 0%; background: #3b82f6; transition: width .2s linear; }
    .progress.indeterminate .bar { width: 30%; animation: indet 1.2s infinite linear; }
    @keyframes indet { 0% { margin-left: -30% } 100% { margin-left: 100% } }
  </style>
</head>
<body>
  <div id="app">
    <div id="tabs">
      <button data-tab="main" class="active">Land value per sqft</button>
      <button data-tab="under">Vacant/Parking/Underdeveloped</button>
    </div>
    <div id="map"></div>
    <div id="title">South Bend Civil Map</div>

    <div id="controls">
    <div id="googleSignIn"></div>
    <fieldset>
      <label for="file">1) Load a GeoParquet file (.parquet)</label>
      <input id="file" type="file" accept=".parquet,.parq" />
      <div class="buttons">
          <button id="btn-zoomto">Zoom to data</button>
        </div>
      </fieldset>

      <fieldset>
        <label for="field">2) Numeric field to visualize</label>
        <select id="field"><option value="" disabled selected>— load a file first —</option></select>

        <!-- NEW: normalization choices -->
        <div id="normGroup" style="display:grid; gap:6px; margin-top:6px;">
          <label style="display:flex; gap:8px; align-items:center;">
            <input type="radio" name="normMode" id="norm-asis" value="asis" checked />
            <span>as-is</span>
          </label>
          <label style="display:flex; gap:8px; align-items:center;">
            <input type="radio" name="normMode" id="norm-land" value="perLand" disabled />
            <span>…per land size <em id="normLandUnit">(unit)</em></span>
          </label>
          <label style="display:flex; gap:8px; align-items:center;">
            <input type="radio" name="normMode" id="norm-bldg" value="perBuilding" disabled />
            <span>…per building size <em id="normBldgUnit">(unit)</em></span>
          </label>
        </div>
      </fieldset>

      <fieldset class="row">
        <div>
          <label for="ramp">3) Color ramp</label>
          <select id="ramp"></select>
        </div>
        <div>
          <label for="opacity">Opacity</label>
          <div class="inline">
            <input id="opacity" type="range" min="0" max="1" step="0.05" value="0.9" />
            <output id="opacityVal">0.9</output>
          </div>
        </div>
      </fieldset>

      <fieldset class="row">
        <div>
          <label for="mult">4) Extrusion multiplier</label>
          <input id="mult" type="number" step=".1" value="1" />
        </div>
        <div>
          <label for="units">Units</label>
          <select id="units">
            <option value="centimeters" selected>centimeters</option>
            <option value="meters">meters</option>
            <option value="inches">inches</option>
            <option value="feet">feet</option>
            <option value="kilometers">kilometers</option>
            <option value="miles">miles</option>
            <option value="stories">stories (~3.3m)</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <label>5) View presets</label>
        <div class="buttons">
          <button data-view="top">Top</button>
          <button data-view="iso">Isometric</button>
          <button data-view="north">North</button>
          <button data-view="east">East</button>
          <button data-view="south">South</button>
          <button data-view="west">West</button>
        </div>
      </fieldset>
    
    <fieldset>
      <label>6) Color scaling</label>
      <div style="display:grid; gap:6px;">
      <label style="display:flex; gap:8px; align-items:center;">
        <input type="radio" name="colorMode" id="color-cont" value="continuous">
        <span>Linear (min→max, clamped p1–p99)</span>
      </label>
      <label style="display:flex; gap:8px; align-items:center;">
        <input type="radio" name="colorMode" id="color-quant" value="quantiles" checked>
        <span>Quantiles (equal-frequency, p1–p99)</span>
      </label>
      </div>
    </fieldset>

    <fieldset id="statusFieldset">
      <label for="statusFilter">Status filter</label>
      <select id="statusFilter" multiple size="3"></select>
      <label style="display:flex; gap:8px; align-items:center;">
        <input type="checkbox" id="scaleFiltered" />
        <span>Scale heights using filtered data</span>
      </label>
    </fieldset>

      <fieldset id="legend"></fieldset>
    </div>
  </div>

  <!-- Modal 1: Field chooser -->
  <div id="modalOverlay" class="overlay">
    <div class="modal">
      <h3>Select numeric fields to load</h3>
      <div class="muted">Rows: <span id="rowCount">–</span>. Geometry column: <code id="geomCol">–</code></div>
      <div class="buttons">
        <button id="btnAll">Select all</button>
        <button id="btnNone">Select none</button>
      </div>
      <div id="fieldList" class="fieldlist"></div>
      <div class="footer">
        <button id="btnCancelModal">Cancel</button>
        <button id="btnConfirmModal">Next</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Size identification -->
  <div id="sizeOverlay" class="overlay">
    <div class="modal">
      <h3>Identify land & building size fields</h3>
      <div class="muted">Please identify which of your loaded fields represent: (a) total finished floor area for all buildings, and (b) total land area.</div>

      <div style="display:grid; gap:8px;">
        <label>Building size field</label>
        <select id="bldgField"></select>
        <label>Building size unit</label>
        <select id="bldgUnit"></select>

        <div class="divider"></div>

        <label>Land size field</label>
        <select id="landField"></select>
        <label>Land size unit</label>
        <select id="landUnit"></select>
      </div>

      <div class="footer">
        <button id="btnSizeBack">Back</button>
        <button id="btnSizeSkip">Skip</button>
        <button id="btnSizeOk">Continue</button>
      </div>
    </div>
  </div>

  <!-- Loading / progress -->
  <div id="loadingOverlay" class="overlay">
    <div class="modal">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div>Loading…</div>
        <button id="btnCancelLoading">Cancel</button>
      </div>
      <div id="progress" class="progress indeterminate"><div id="progressBar" class="bar"></div></div>
      <div id="progressMsg" class="muted">Parsing GeoParquet…</div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
